services:
  userapi:
    build: .
    image: userapi:latest
    container_name: userapi

    ports:
      - "5000:5000"

    environment:
      DATABASE_PATH: /data/app.db
      PORT: 5000
      LOG_LEVEL: INFO

    volumes:
      - userapi_data:/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  userapi_data:
